# branch-sprawl-guard is ON by default with no conf at all. Drop this file at
#   <repo>/.claude/hooks/branch-sprawl.conf   (this repo only), or
#   ~/.claude/hooks/branch-sprawl.conf        (every repo on the machine)
# to tune it. A repo conf overrides the global one.
#
# The guard looks at `git worktree add` only. Once the repo already has
# MAX_WORKTREES working trees, it sorts them: a finished one has nothing unsaved,
# its work is pushed and no other session is in it. If any are finished it denies
# the add and gives the session the commands to reuse or remove them, so nobody is
# asked. If every tree holds live work, it does what DECISION says.
# A new branch inside an existing tree (switch -c, checkout -b) always passes.

# 0 opts this repo (or the machine) out entirely.
ENABLED=1

# Look once this many working trees already exist (primary checkout + each
# `git worktree add`; the bare repo itself is not counted).
MAX_WORKTREES=5

# When every tree holds live work: `nudge` lets the add through and tells the
# session what would land each tree (default), `ask` lets you decide, `deny` stops.
DECISION=nudge

# Another session counts as using a tree when its transcript, changed within
# this many minutes, names the tree's path.
IN_USE_MINUTES=120
