# branch-sprawl-guard is ON by default with no conf at all. Drop this file at
#   <repo>/.claude/hooks/branch-sprawl.conf   (this repo only), or
#   ~/.claude/hooks/branch-sprawl.conf        (every repo on the machine)
# to tune it. A repo conf overrides the global one.
#
# The guard interrupts a *creating* git command (worktree add, checkout -b/-B,
# switch -c/-C, branch <new>, --orphan) once the repo already has MAX_WORKTREES
# working trees, so you reconcile something to main before opening another front.

# 0 opts this repo (or the machine) out entirely.
ENABLED=1

# Fire when this many working trees already exist (primary checkout + each
# `git worktree add`; the bare repo itself is not counted).
MAX_WORKTREES=5

# `ask` = warn and let you consciously proceed (default). `deny` = hard stop.
DECISION=ask
