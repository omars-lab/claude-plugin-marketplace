# .claude/hooks/concurrent-session.conf   (repo)
# ~/.claude/hooks/concurrent-session.conf  (global fallback, used when the repo has none)
#
# UserPromptSubmit + SessionStart: warn when other Claude Code sessions are active in the
# same working tree. PreToolUse(Bash): restate the branch before commit/merge/push/rebase/
# cherry-pick while another session is active.

ENABLED=1
ACTIVE_WINDOW_MIN=10        # a transcript touched within this many minutes counts as active
REMIND_EVERY_MIN=30         # repeat the warning at most this often unless the count grows
COMMIT_REMINDER=1           # arm the PreToolUse branch reminder
INCLUDE_SUBDIR_SESSIONS=1   # sessions started in a subdirectory of this tree count too
