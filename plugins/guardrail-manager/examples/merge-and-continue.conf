# .claude/hooks/merge-and-continue.conf  (or ~/.claude/hooks/ for the whole machine)
#
# Stop hook: when the last assistant message asks about merging ("shall I merge?",
# "ready to merge", "left it open for review"), send the session back to merge the PR
# once it is CLEAN and continue with the next item. Fires once per stop.
ENABLED=1
# Matched against the basename of the git top-level, so worktrees (bikar-work) count.
REPO_REGEX=^(3d-models|3d-model-hub|bikar|qiyas)(-.*)?$
# Optional: replace the phrases that count as a merge question, or the instruction sent back.
# ASK_REGEX=\bshall i merge\b|\bready to merge\b
# MESSAGE=Merge it with gh pr merge N --squash once CLEAN, then continue.
