# .claude/hooks/policy-review.conf
#
# Stop hook: one section per policy. A policy fires when SIGNAL_REGEX matches the
# session transcript and DONE_REGEX does not. Regexes are Python `re`, case-insensitive
# unless IGNORE_CASE = 0. Multi-line MESSAGE values continue on indented lines.
#
# CHANNEL:
#   stderr  (default) print the reminder for the person
#   system  emit a systemMessage
#   block   return decision=block so Claude itself acts on the reminder before stopping
#           (fires once per stop; honours stop_hook_active)

[privacy]
SIGNAL_REGEX = draft:\s*false|publish|deploy|personal|confidential
DONE_REGEX   = privacy.review|reviewed for leaks
MESSAGE      = This session touched content that ships publicly.
    Run the privacy review before publishing or deploying it.

[generated-files]
SIGNAL_REGEX = \bdist/|\bbuild/|\.generated\.
DONE_REGEX   = make build|npm run build
MESSAGE_FILE = docs/policies/regenerate-before-commit.md
CHANNEL      = block

[disabled-example]
ENABLED      = 0
SIGNAL_REGEX = .
MESSAGE      = never shown
