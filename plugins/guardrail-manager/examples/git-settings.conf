# git-settings-guard runs with no conf at all. This file only exists to turn parts of it off.
# Put it in <repo>/.claude/hooks/ for one repo, or ~/.claude/hooks/ for the machine.
# A repo's conf replaces the machine one, so a repo's ENABLED=1 overrides a machine-wide ENABLED=0.

# ENABLED=0 turns the whole guard off: no reports, no denies, no fixes.
ENABLED=0

# AUTO_FIX=0 keeps the guard on but stops its one fix: rewriting an absolute core.hooksPath that
# points at the repo's own hooks folder (e.g. /path/to/repo/.githooks) to the relative .githooks.
# With AUTO_FIX=0 it only reports the problem and the command that fixes it.
# AUTO_FIX=0
